<!DOCTYPE html>
<!--
  ADK demo message style template.
  Placeholders are substituted at runtime by ui/chat/HtmlMessageBubble.kt:
    {{BASE_FONT_PX}}  base font size (16 phone / 19 car, 1.2x car scale)
    {{FG}}            main foreground
    {{ACCENT}}        headings / links / blockquote bar
    {{MUTED}}         secondary text
    {{CARD}}          table header background
    {{CARD_BORDER}}   table / pre borders
    {{CODE_BG}}       inline + block code background
    {{BODY}}          sanitized assistant HTML fragment
  Colors mirror the Compose palettes in ui/theme/Color.kt:
    car:  fg #DFE9EE on near-black #0E1417 family, accent CarPrimary #7FD8FF
    phone: fg #1A1B1F on #FDFBFF family, accent PhonePrimary #1565C0
  The WebView body is transparent so the Compose bubble color shows through.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --base-font: {{BASE_FONT_PX}}px;
      --fg: {{FG}};
      --accent: {{ACCENT}};
      --muted: {{MUTED}};
      --card: {{CARD}};
      --card-border: {{CARD_BORDER}};
      --code-bg: {{CODE_BG}};
    }
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      font-size: var(--base-font);
      line-height: 1.5;
      color: var(--fg);
      -webkit-text-size-adjust: 100%;
      word-break: break-word;
    }
    h1, h2, h3, h4, h5, h6 {
      color: var(--accent);
      font-weight: 600;
      line-height: 1.3;
      margin: 0.8em 0 0.4em;
    }
    h1 { font-size: 1.6em; }
    h2 { font-size: 1.4em; }
    h3 { font-size: 1.2em; }
    h4, h5, h6 { font-size: 1.05em; }
    p { margin: 0.5em 0; }
    ul, ol { margin: 0.5em 0; padding-inline-start: 1.4em; }
    li { margin: 0.25em 0; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.7em 0;
    }
    th, td {
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background: var(--card);
      color: var(--accent);
      font-weight: 600;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 0.7em 0;
      overflow-x: auto;
    }
    code {
      font-family: monospace;
      font-size: 0.92em;
    }
    pre code {
      background: transparent;
      padding: 0;
      border: 0;
    }
    :not(pre) > code {
      background: var(--code-bg);
      border-radius: 4px;
      padding: 1px 5px;
    }
    blockquote {
      margin: 0.7em 0;
      padding: 2px 12px;
      border-inline-start: 3px solid var(--accent);
      color: var(--muted);
    }
    a { color: var(--accent); text-decoration: underline; }
    strong { font-weight: 700; }
    hr { border: 0; border-top: 1px solid var(--card-border); margin: 0.9em 0; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
{{BODY}}
</body>
</html>
